[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-atlas"
version = "0.2.0"
description = "Python and C++ algorithm implementations with reproducible verification"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.169.0", "ruff==0.17.0"]

[tool.setuptools]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100
builtins = ["ListNode", "TreeNode"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

