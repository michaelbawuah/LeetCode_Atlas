name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validate generated catalog
        run: python tools/catalog.py --check
      - name: Run examples and property tests
        run: python -m pytest --junitxml=build/python-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: build/python-tests.xml

  cpp:
    name: C++23 / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: GCC
            compiler: g++
            sanitizers: 'OFF'
          - os: ubuntu-24.04
            label: Clang-sanitizers
            compiler: clang++
            sanitizers: 'ON'
          - os: macos-14
            label: Apple-Clang
            compiler: clang++
            sanitizers: 'OFF'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: python -m pip install -e '.[dev]' cmake ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DATLAS_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test C++ adapters
        run: ctest --test-dir build --output-on-failure
      - name: Compare shared fixtures and generated cases
        env:
          ATLAS_CPP_BIN_DIR: build/bin
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m pytest tests/test_cases.py tests/test_cpp_properties.py --junitxml=build/cpp-parity.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-${{ matrix.label }}
          path: build/cpp-parity.xml

